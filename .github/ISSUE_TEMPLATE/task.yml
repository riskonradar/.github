name: Task
description: A change to make
type: Task
body:
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope / out of scope
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when (commands or checks)
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: Likely files or entry points
